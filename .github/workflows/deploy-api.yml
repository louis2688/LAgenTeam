name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "Dockerfile.api"
      - "railway.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  railway:
    name: Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service api --ci -y
